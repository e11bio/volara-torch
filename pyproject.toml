[project]
name = "volara-ml"
version = "1.2.0"
description = "Plugin for Volara including ML-related tasks. This includes the `Predict` task and the `models` module."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "volara>=1.0.4",
    "daisy>=1.2.2",
    "gunpowder>=1.5.0",
    "funlib.geometry>=0.3",
    "funlib.persistence>=0.7",
    "pydantic>=2.6.3",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
jax = ["jax>=0.4.30", "flax>=0.8", "orbax-checkpoint>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "torch>=2.4",
    "ty>=0.0.24",
]
docs = [
    "autodoc_pydantic>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-material>=0.0.36",
    "sphinx-click>=6.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=4.0",
    "jupyter-sphinx>=0.5",
    "matplotlib>=3.0",
    "pooch>=1.8",
    "wget>=3.2",
    "funlib-show-neuroglancer>=0.2",
    "nbsphinx>=0.9.7",
    "jupytext>=1.16.7",
]

[project.entry-points."volara.blockwise_tasks"]
predict = "volara_ml.blockwise.predict:Predict"

[tool.ruff]
lint.select = ["F", "W", "I001"]

[[tool.mypy.overrides]]
module = [
    "daisy.*",
    "gunpowder.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
